spring:
  profiles:
    active: dev
  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8761

logging:
  level:
    root: WARN
    es.upm.miw: DEBUG

eureka:
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 30000
    renewal-threshold-update-interval-ms: 900000
    expected-client-renewal-interval-seconds: 30
  client:
    register-with-eureka: false
    fetch-registry: false
